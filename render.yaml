services:
  - type: web
    name: proofx-regullens-aicte
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.14.0
      - key: PORT
        value: 10000
